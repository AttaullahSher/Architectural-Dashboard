<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>AKM HQ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: #08131f; color: #e8eef6;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 420px; text-align: center; }
  h1 { margin: 0 0 12px; font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: #c9a227; }
  p { margin: 0 0 24px; color: #9fb0c5; }
  a {
    display: inline-block; padding: 13px 22px; border-radius: 12px;
    background: #c9a227; color: #08131f; font-weight: 700; text-decoration: none;
  }
  a:hover { background: #d5a544; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>AKM <span>HQ</span></h1>
  <p>The dashboard is private. Sign in to open it.</p>
  <a href="https://crm.akm-music.com/hq" rel="noreferrer">Sign in to AKM HQ</a>
</main>
</body>
</html>
