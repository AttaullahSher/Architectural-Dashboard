<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive 3D map of the AKM Music, Hkula and The Anfal tech stack.">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>AKM Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ground:#0b1016; --panel:rgba(14,19,26,.9); --line:#26313d; --ink:#e9eef3; --muted:#8796a6;
    --amber:#ffb454; --cyan:#5fe3d9; --green:#25d366; --pink:#ff7ac6; --red:#ff6b6b; --blue:#6aa8ff;
    --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--display);overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  button{font:500 12px var(--mono);color:var(--ink);background:#18212b;border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
  button:hover{border-color:#3f4d5e}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--amber);color:#1a1206;border-color:var(--amber)}

  .brand{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;padding:8px 14px 8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
  .brand b{font-weight:800;font-size:18px;letter-spacing:-.01em}
  .brand b span{color:var(--amber)}
  .live{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,107,107,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
  .time{font:500 18px var(--mono);font-variant-numeric:tabular-nums}

  #toasts{position:fixed;left:16px;top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:min(300px,calc(100% - 32px));pointer-events:none;z-index:5}
  .toast{display:grid;grid-template-columns:10px 1fr;gap:4px 10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.35;backdrop-filter:blur(8px);animation:tin .35s ease-out}
  .toast .d{width:10px;height:10px;border-radius:50%;margin-top:4px}
  .toast small{display:block;font:11px var(--mono);color:var(--muted);margin-bottom:2px}
  .toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
  @keyframes tin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);max-width:calc(100% - 32px);overflow-x:auto}
  .dock .sep{width:1px;background:var(--line);margin:4px 2px}

  #drawer{position:fixed;right:16px;top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);display:flex;flex-direction:column;overflow:hidden}
  #drawer header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  #drawer h2{margin:0;font-size:17px;font-weight:700}
  #drawer .body{padding:12px 14px;overflow:auto;flex:1}
  .kicker{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 8px}
  .kicker:first-child{margin-top:0}
  .msg{display:grid;grid-template-columns:10px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid #1e2833;font-size:13px;line-height:1.4}
  .msg .d{width:10px;height:10px;border-radius:50%;margin-top:4px}
  .msg .meta{font:11px var(--mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{font:500 10.5px var(--mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink)}
  .chip.ai{border-color:#2b5d58;color:var(--cyan)}
  .chip.team{border-color:#5d472b;color:var(--amber)}
  .chip.ok{border-color:#2c5a38;color:#7bd88f}
  .job{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid #1e2833;font-size:13px}
  .job .bar{grid-column:1/-1;height:4px;border-radius:4px;background:#1c2631;overflow:hidden}
  .job .bar i{display:block;height:100%;background:var(--cyan)}
  .job small{font:11px var(--mono);color:var(--muted)}
  .sched{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px dashed #1e2833}
  .sched .tm{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:#131a22;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kpi b{display:block;font:700 24px var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi span{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .kpi em{font:normal 11px var(--mono);color:#7bd88f;margin-left:6px}
  .chart{width:100%;display:block;background:#131a22;border:1px solid var(--line);border-radius:10px}
  .foot{font:11px var(--mono);color:#5d6b7a;margin-top:12px}
  .sw{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1e2833;font-size:13px}
  .sw small{display:block;font:11px var(--mono);color:var(--muted)}
  .sw.child{padding-left:14px}
  .toggle{position:relative;width:40px;height:22px;border-radius:99px;border:1px solid var(--line);background:#2a1f22;cursor:pointer;padding:0}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#ff6b6b;transition:.2s}
  .toggle[aria-checked="true"]{background:#16332f}
  .toggle[aria-checked="true"]::after{left:20px;background:var(--cyan)}
  .prov{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#121920}
  .prov h4{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .prov .sub{font:11px var(--mono);color:var(--muted);margin-top:2px}
  .st{font:500 10.5px var(--mono);padding:2px 8px;border-radius:99px}
  .st.ok{background:#14302a;color:#7bd88f}.st.warn{background:#3a2c14;color:#ffb454}.st.bad{background:#3a1a1e;color:#ff6b6b}
  .meter{margin-top:8px;font:11px var(--mono);color:#aab6c2}
  .meter .l{display:flex;justify-content:space-between;gap:8px}
  .meter .t{height:5px;border-radius:5px;background:#1c2631;margin-top:4px;overflow:hidden}
  .meter .t i{display:block;height:100%}
  .repo{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed #1e2833;font-size:13px}
  .repo .d{width:10px;height:10px;border-radius:50%}
  .repo small{font:11px var(--mono);color:var(--muted)}

  #card{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px)}
  #card .kind{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--amber)}
  #card h3{margin:2px 0 4px;font-size:17px}
  #card p{margin:0;font-size:13px;line-height:1.5;color:#c7d1db}
  #card button{position:absolute;right:8px;top:8px;padding:3px 8px}

  .film .brand .time,.film #upt,.film .dock,.film #drawer,.film #card{display:none!important}
  #exitFilm{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));opacity:.25}
  #exitFilm:hover{opacity:1}
  .watermark{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font:800 15px var(--display);color:rgba(233,238,243,.55);letter-spacing:.01em;pointer-events:none}
  .watermark span{color:var(--amber)}

  @media (max-width:720px){
    #drawer{top:auto;left:16px;right:16px;width:auto;height:52%}
    #card{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
    #toasts{width:min(250px,calc(100% - 32px))}
    .brand b{font-size:16px}
  }
</style>
</head>
<body>

<div id="stage" aria-label="3D campus of AKM Music, Hkula, The Anfal and Asher's Lab"></div>

<div class="brand"><b>AKM <span>HQ</span></b><span class="live"><i></i>Live</span><span class="time" id="time">--:--</span><span class="live" id="upt" style="color:#7bd88f"></span></div>

<aside id="drawer" hidden><header><h2 id="dTitle">Inbox</h2><button id="dClose" aria-label="Close panel">Close</button></header><div class="body" id="dBody"></div></aside>
<div id="card" hidden></div>

<nav class="dock" aria-label="Controls">
  <button id="bInbox" aria-pressed="false">Activity</button>
  <button id="bJobs" aria-pressed="false">Jobs</button>
  <button id="bReports" aria-pressed="false">Reports</button>
  <button id="bInfra" aria-pressed="false">Infrastructure</button>
  <span class="sep"></span>
  <button id="sp1" aria-pressed="true">Live</button>
  <button id="sp60" aria-pressed="false">×60</button>
  <button id="sp600" aria-pressed="false">×600</button>
  <span class="sep"></span>
  <button id="bFilm" aria-pressed="false">Film mode</button>
</nav>
<button id="exitFilm" hidden>Exit film</button>
<div class="watermark" id="wm" hidden>AKM <span>HQ</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
try { await document.fonts.ready; } catch(e){}
try {
const T=THREE;
const PUBLIC=true; const LIVE_SINCE=Date.UTC(2026,5,15);
// ---------------- renderer / scene ----------------
const stage=document.getElementById('stage');
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new T.Scene();
scene.background=new T.Color('#0b1016'); scene.fog=new T.Fog('#0b1016',190,340);
const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,.5,600);
const narrow=innerWidth<720;
camera.position.set(narrow?10:6, narrow?230:150, narrow?220:150);
const controls=new T.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,14); controls.enableDamping=true; controls.maxPolarAngle=1.3; controls.minDistance=15; controls.maxDistance=240; controls.autoRotateSpeed=.55;
const hemi=new T.HemisphereLight('#9fb6d6','#1a1410',.5); scene.add(hemi);
const sun=new T.DirectionalLight('#ffe2b8',.9); sun.position.set(50,90,40); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-100,right:100,top:100,bottom:-100,near:10,far:300}); scene.add(sun);

// ---------------- helpers ----------------
const pickables=[];
const mat=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:.05},o));
function box(w,h,d,c,x,y,z,o){ const m=new T.Mesh(new T.BoxGeometry(w,h,d),c.isMaterial?c:mat(c,o)); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m; }
function cyl(rt,rb,h,c,x,y,z,o,seg=20){ const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),c.isMaterial?c:mat(c,o)); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m; }
function glow(w,h,c,x,y,z,ry=0){ const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:c,side:T.DoubleSide})); m.position.set(x,y,z); m.rotation.order='YXZ'; m.rotation.set(-.42,ry,0); scene.add(m); return m; }
function tag(obj,info){ obj.traverse(o=>{ if(o.isMesh){o.userData.info=info; pickables.push(o);} }); return obj; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const fadeLabels=[];
function label(text,opts={}){
  const {sub='',accent='#ffb454',size=1}=opts;
  const c=document.createElement('canvas'),g=c.getContext('2d'); const W=1024,H=sub?290:180; c.width=W;c.height=H;
  g.font='800 92px "Bricolage Grotesque", sans-serif'; const tw=g.measureText(text).width;
  g.font='500 48px "IBM Plex Mono", monospace'; const sw=sub?g.measureText(sub).width:0;
  const bw=Math.min(W-8,Math.max(tw,sw)+96), x0=(W-bw)/2;
  g.fillStyle='rgba(12,17,23,.84)'; rr(g,x0,6,bw,H-12,34); g.fill();
  g.fillStyle=accent; rr(g,x0,6,14,H-12,7); g.fill();
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#eef2f6';
  g.font='800 92px "Bricolage Grotesque", sans-serif'; g.fillText(text,W/2+6,sub?98:H/2+4);
  if(sub){ g.fillStyle='#9fb0c0'; g.font='500 48px "IBM Plex Mono", monospace'; g.fillText(sub,W/2+6,208); }
  const tex=new T.CanvasTexture(c); tex.anisotropy=4;
  const s=new T.Sprite(new T.SpriteMaterial({map:tex,depthTest:false,transparent:true})); s.renderOrder=10; s.scale.set(16*size,16*size*H/W,1); scene.add(s); fadeLabels.push({s,lo:40*size+8,hi:66*size+12}); return s;
}
const leds=[];
function led(x,y,z,c){ const m=new T.Mesh(new T.BoxGeometry(.14,.09,.05),new T.MeshBasicMaterial({color:c})); m.position.set(x,y,z); scene.add(m); leds.push({m,c:new T.Color(c),ph:Math.random()*6,sp:1+Math.random()*5}); return m; }
const screens=[];
function screen(w,h,c,x,y,z,ry=0){ const s=glow(w,h,c,x,y,z,ry); screens.push({s,c:new T.Color(c),ph:Math.random()*6}); return s; }

// ---------------- ground ----------------
const ground=new T.Mesh(new T.PlaneGeometry(700,700),mat('#0f151c')); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// campus paths
box(150,.04,6,'#161d25',0,.02,33); box(6,.04,90,'#161d25',-39,.02,0); box(6,.04,90,'#161d25',39,.02,0);
for(let i=-9;i<=9;i++) box(2,.05,.3,'#c9a55a',i*8,.05,40.5);
box(160,.04,8,'#12181f',0,.02,41);

// ---------------- rooms ----------------
const WALL_H=2.6, WT=.25;
function room(r){
  const {x0,z0,x1,z1,floor,gaps={}}=r; const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  const f=box(w-.3,.12,d-.3,floor,cx,.06,cz); f.castShadow=false; tag(f,r.info);
  const wm=mat(r.wall||'#2a3441',{roughness:.9});
  const side=(n,a0,a1,fixed,axis)=>{ const gs=(gaps[n]||[]).map(g=>[g[0]-g[1]/2,g[0]+g[1]/2]).sort((a,b)=>a[0]-b[0]); let cur=a0; const segs=[];
    for(const [g0,g1] of gs){ if(g0>cur) segs.push([cur,g0]); cur=Math.max(cur,g1);} if(cur<a1) segs.push([cur,a1]);
    for(const [s0,s1] of segs){ const len=s1-s0,mid=(s0+s1)/2; if(axis==='x') box(len,WALL_H,WT,wm,mid,WALL_H/2,fixed); else box(WT,WALL_H,len,wm,fixed,WALL_H/2,mid);} };
  const i=.15; side('n',x0+i,x1-i,z0+i,'x'); side('s',x0+i,x1-i,z1-i,'x'); side('w',z0+i,z1-i,x0+i,'z'); side('e',z0+i,z1-i,x1-i,'z');
  // glowing trim on top of walls
  const trim=new T.MeshBasicMaterial({color:r.accent||'#ffb454'});
  [[w-.3,cx,z0+i],[w-.3,cx,z1-i]].forEach(([len,x,z])=>{ const t=new T.Mesh(new T.BoxGeometry(len,.06,.28),trim); t.position.set(x,WALL_H+.03,z); scene.add(t); });
  if(r.name){ const L=label(r.name,{sub:r.sub,accent:r.accent,size:r.labelSize||.8}); L.position.set(cx,WALL_H+2.2,cz+d/2-2.4); }
  return r;
}
// Information cards (public-safe wording only)
const I={
  lobby:{kind:'AKM Music · automation worker',name:'The robot lobby',p:'One cloud worker, twelve jobs. Each robot sleeps on its pad until a customer message, a payment or its own clock wakes it, then does its job in about a second.'},
  website:{kind:'AKM Music · website',name:'akm-music.com',p:'The online shop window, with thousands of product listings and eight enquiry forms that hand straight over to the robots.'},
  crm:{kind:'AKM Music · CRM',name:'Customer desk',p:'Every WhatsApp, Instagram and Messenger conversation lands here, with the list of chats that need a person and the AI health board.'},
  docs:{kind:'AKM Music · documents',name:'Docs',p:'Invoices, quotations, statements and receipts, with online payment links.'},
  pos:{kind:'AKM Music · shop till',name:'POS',p:'The point-of-sale system at the counter, with its daily sales report.'},
  repair:{kind:'AKM Music · service',name:'Repair works',p:'Instrument repairs and restrings. Requests from the website arrive with a ticket code and the map pin to the shop.'},
  studio:{kind:'AKM Music · practice room',name:'Practice studio',p:'Hourly practice room for solo players and bands, booked by the Booking clerk robot straight from WhatsApp.'},
  vault:{kind:'AKM Music · data',name:'Records vault',p:'Three separate databases, one per system, so no app can trip over another app\'s records.'},
  ai:{kind:'AI providers',name:'The AI brains',p:'Claude writes the replies customers see, for about $13 a month. Kimi K2.6, DeepSeek, Groq and Gemini run free and take over instantly if Claude is busy. Every draft is checked against the shop\'s rules before it is sent.'},
  doors:{kind:'Customer doors',name:'WhatsApp · Instagram · Messenger',p:'Every message walks in through one of these doors and straight to the Receptionist.'},
  money:{kind:'Payments',name:'Tabby & PayPal',p:'Payment kiosks across the street. The Cashier double-checks every payment with the provider before an invoice is marked paid.'},
  crane:{kind:'Deployments',name:'The deploy crane',p:'Every change is tested and lifted in automatically the moment it is approved. Nobody deploys by hand.'},
  hkula:{kind:'Company',name:'Hkula',p:'Its own building, its own cloud worker and its own team of robots.'},
  anfal:{kind:'Company',name:'The Anfal',p:'The third company on the campus, with its own offices and staff robots.'},
  lab:{kind:'Personal projects',name:'Asher\'s Lab',p:'The side projects: Ashgrab, a video downloader; VPN Stealth, a private VPN; and askAsher, the personal portfolio.'},
};

// ============ AKM MUSIC HQ ============
const AK='#ffb454';
room({x0:-10,z0:-8,x1:10,z1:24,floor:'#2c2a24',wall:'#3a3428',accent:AK,name:'akm-pay',sub:'robot lobby · Cloudflare Worker',labelSize:1,info:I.lobby,gaps:{w:[[0,3],[15,3]],e:[[0,3],[15,3]],n:[[0,3]],s:[[-5,2.2],[0,2.2],[5,2.2]]}});
room({x0:-30,z0:-8,x1:-10,z1:8,floor:'#1e2b36',accent:'#5fe3d9',name:'akm-music.com',sub:'AKM-Web',info:I.website,gaps:{e:[[0,3]],w:[[0,3]]}});
room({x0:-30,z0:8,x1:-10,z1:24,floor:'#2a2233',accent:'#c792ea',name:'AKM-POS',sub:'shop counter',info:I.pos,gaps:{e:[[15,3]],s:[[-20,3]]}});
room({x0:10,z0:-8,x1:30,z1:8,floor:'#1f2e2a',accent:'#7bd88f',name:'AKM-CRM',sub:'crm.akm-music.com',info:I.crm,gaps:{w:[[0,3]],n:[[20,3]]}});
room({x0:10,z0:8,x1:30,z1:24,floor:'#2d2a20',accent:'#f2c14e',name:'AKM-Docs',sub:'quotes · invoices · DOs',info:I.docs,gaps:{w:[[15,3]]}});
room({x0:-10,z0:-22,x1:10,z1:-8,floor:'#2e241c',accent:'#ff8a5c',name:'Repair works',info:I.repair,gaps:{s:[[0,3]]}});
room({x0:10,z0:-22,x1:30,z1:-8,floor:'#1b2230',accent:'#6aa8ff',name:'Records vault',info:I.vault,gaps:{s:[[20,3]]}});

// ---------------- pipelines ----------------
const pipes=[]; const P=(x,y,z)=>new T.Vector3(x,y,z);
function pipe(pts,color,name,opts={}){
  const path=new T.CurvePath(); const v=pts.map(q=>new T.Vector3(q[0],q[1],q[2]));
  for(let i=0;i<v.length-1;i++) path.add(new T.LineCurve3(v[i],v[i+1]));
  const len=path.getLength();
  const tube=new T.Mesh(new T.TubeGeometry(path,Math.max(20,Math.round(len*2)),opts.r||.2,10,false),mat(color,{metalness:.55,roughness:.3,emissive:color,emissiveIntensity:.18}));
  tube.castShadow=true; scene.add(tube);
  for(const q of v){ const j=new T.Mesh(new T.SphereGeometry((opts.r||.2)*1.45,12,10),mat('#2b3139',{metalness:.6,roughness:.3})); j.position.copy(q); scene.add(j); }
  const info={kind:'Pipeline',name,p:opts.p||''}; tag(tube,info);
  const n=Math.max(3,Math.round(len/6)), pulses=[];
  for(let i=0;i<n;i++){ const m=new T.Mesh(new T.BoxGeometry(.5,.5,.5),new T.MeshBasicMaterial({color:new T.Color(color).lerp(new T.Color('#ffffff'),.45)})); scene.add(m); pulses.push({m,t:i/n}); }

    window._spark.intensity=Math.random()<.15?3:0; window._studioLight.intensity=1+Math.sin(now*4)*.6;
    window._siteBars.forEach((b,i)=>{ const hgt=W.website?.4+Math.abs(Math.sin(now*1.3+i))*2.2:.1; b.scale.y=hgt; b.position.y=.7+hgt/2; });
    window._paper.position.z=21.3+((now*.8)%1)*.6; }
  uiT+=dt; if(uiT>.3){ uiT=0; tEl.textContent=hhmm(u)+(speed>1?' ×'+speed:''); document.getElementById('upt').textContent=`Live since 15 Jun · ${daysLive()}d · ${PUBLIC?'99.99':'99.95'}% up`; refresh(); }
  for(const a of apps){ if(now-a.last>.15){ a.last=now; a.draw(a.g,a.c.width,a.c.height,a.st,now); a.tex.needsUpdate=true; } }
  nextCust-=dt; if(nextCust<=0){ spawnCustomer(); nextCust=5+Math.random()*5; }
  for(let i=people.length-1;i>=0;i--){ const q=people[i]; if(q.w>0){ q.w-=dt; if(q.w<=0) { q.path=q.path.slice().reverse(); q.i=1; q.back=true; } continue; }
    const tgt=q.path[q.i], d=tgt.clone().sub(q.g.position), L=d.length(), st=2.6*dt;
    if(L<=st){ q.g.position.copy(tgt); q.i++; if(q.i>=q.path.length){ if(q.back){ scene.remove(q.g); people.splice(i,1); } else q.w=q.wait; } }
    else { q.g.position.add(d.multiplyScalar(st/L)); q.g.rotation.y=Math.atan2(d.x,d.z); const sw=Math.sin(now*12+i)*.5; q.l[0].rotation.x=sw; q.l[1].rotation.x=-sw; } }
  for(const L of fadeLabels){ const d=camera.position.distanceTo(L.s.position); L.s.material.opacity=Math.max(0,Math.min(1,(d-L.lo)/(L.hi-L.lo))); L.s.visible=L.s.material.opacity>.02; }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(frame);
}
setTimeout(()=>incoming(CH[0]),800);
frame();
} catch(err){ const c=document.getElementById('card'); c.hidden=false; c.innerHTML='<h3>3D view could not start</h3><p>'+String(err&&err.message||err)+'</p>'; }
})();
</script>
